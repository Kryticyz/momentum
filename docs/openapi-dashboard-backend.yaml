openapi: 3.0.3
info:
  title: Momentum Dashboard Backend API
  version: 2.1.0
  description: API contract for the momentum dashboard backend.
servers:
  - url: http://localhost:8080
tags:
  - name: Health
  - name: Refresh
  - name: Entries
  - name: Ingestion
  - name: Aggregates
security:
  - BearerAuth: []
paths:
  /health:
    get:
      tags: [Health]
      summary: Service health and store metadata
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/HealthData'
        '405':
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /refresh:
    post:
      tags: [Refresh]
      summary: Reload JSONL data into memory
      responses:
        '200':
          description: Refresh succeeded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RefreshData'
        '405':
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Refresh failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/entries:
    get:
      tags: [Entries]
      summary: Raw entries filtered by date range
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Raw entries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/TimeEntry'
        '400':
          description: Invalid date range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Ingestion]
      summary: Push entries via JSON array
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/TimeEntry'
      responses:
        '201':
          description: Entries accepted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PushResult'
        '400':
          description: Invalid body or validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/projects:
    get:
      tags: [Aggregates]
      summary: Project totals in range
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Project aggregates
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ProjectStat'
        '400':
          description: Invalid date range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/days:
    get:
      tags: [Aggregates]
      summary: Daily totals (zero-filled)
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Daily aggregates
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/DayStat'
        '400':
          description: Invalid date range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/weeks:
    get:
      tags: [Aggregates]
      summary: Weekly totals
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Weekly aggregates
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/WeekStat'
        '400':
          description: Invalid date range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/import:
    post:
      tags: [Ingestion]
      summary: Import entries via JSONL body
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
              description: JSONL text — one TimeEntry JSON object per line.
      responses:
        '201':
          description: Entries imported
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ImportResult'
        '400':
          description: Invalid JSONL body or empty
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/planned-vs-actual:
    get:
      tags: [Aggregates]
      summary: Planned vs actual (stub)
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '501':
          description: Not implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: API key passed as Bearer token. Empty key disables auth.
  parameters:
    From:
      name: from
      in: query
      required: false
      schema:
        type: string
        pattern: '^\d{4}-\d{2}-\d{2}$'
      description: Start date in YYYY-MM-DD format.
    To:
      name: to
      in: query
      required: false
      schema:
        type: string
        pattern: '^\d{4}-\d{2}-\d{2}$'
      description: End date in YYYY-MM-DD format.
  schemas:
    ResponseMeta:
      type: object
      required: [count, lastLoaded]
      properties:
        count:
          type: integer
          description: Number of items in the data payload.
          example: 142
        lastLoaded:
          type: string
          description: RFC 3339 timestamp of most recent data reload, or empty string when never loaded.
          example: '2026-02-19T10:00:00+11:00'
    APIEnvelope:
      type: object
      required: [data]
      properties:
        data: {}
        meta:
          $ref: '#/components/schemas/ResponseMeta'
      description: Standard response envelope. All successful responses use this shape.
    HealthData:
      type: object
      required: [status, entries, database]
      properties:
        status:
          type: string
          example: ok
        entries:
          type: integer
          example: 142
        listenAddress:
          type: string
          example: ':8080'
        database:
          type: string
          description: Database connectivity status. "ok" when connected, "unreachable" on failure, "n/a" for in-memory store.
          enum: [ok, unreachable, n/a]
          example: ok
    RefreshData:
      type: object
      required: [ok, entries]
      properties:
        ok:
          type: boolean
          example: true
        entries:
          type: integer
          example: 142
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    TimeEntry:
      type: object
      required:
        - source
        - filePath
        - date
        - project
        - start
        - end
        - minutes
        - note
        - lineNumber
      properties:
        source:
          type: string
          example: daily-note
        filePath:
          type: string
          example: 2026-02-12.md
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          example: 2026-02-12
        project:
          type: string
          example: Project A
        start:
          type: string
          example: '09:10'
        end:
          type: string
          example: '09:45'
        minutes:
          type: integer
          example: 35
        note:
          type: string
          example: Deep work
        lineNumber:
          type: integer
          example: 42
    ProjectStat:
      type: object
      required: [project, minutes, hours]
      properties:
        project:
          type: string
          example: Project A
        minutes:
          type: integer
          example: 320
        hours:
          type: number
          format: double
          example: 5.33
    DayStat:
      type: object
      required: [date, minutes, hours]
      properties:
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          example: 2026-02-12
        minutes:
          type: integer
          example: 180
        hours:
          type: number
          format: double
          example: 3
    WeekStat:
      type: object
      required: [weekStart, minutes, hours]
      properties:
        weekStart:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          example: 2026-02-08
        minutes:
          type: integer
          example: 640
        hours:
          type: number
          format: double
          example: 10.67
    PushResult:
      type: object
      required: [accepted]
      properties:
        accepted:
          type: integer
          description: Number of entries accepted.
          example: 5
    ImportResult:
      type: object
      required: [imported]
      properties:
        imported:
          type: integer
          description: Number of entries imported.
          example: 10
